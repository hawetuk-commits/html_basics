
<!DOCTYPE html>
<html>
<head>
    <title>My Simple Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        .header {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .navbar {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .container {
            display: flex;
            margin: 20px;
            gap: 20px;
        }

        .main {
            background-color: white;
            padding: 20px;
            flex: 3;
        }

        .sidebar {
            background-color: lightblue;
            padding: 20px;
            flex: 1;
        }

        .footer {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Welcome to My Website</h1>
        <p>Learn, Build, Grow</p>
    </div>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">

        <div class="main">
            <h2>About Me</h2>
            <p>
                Hello! I am a Software Engineering student.
                I love learning HTML and CSS.
            </p>
            <button>Learn More</button>
        </div>

        <div class="sidebar">
            <h2>Quick Links</h2>
            <p>Web Development</p>
            <p>Python</p>
            <p>Database</p>
        </div>

    </div>

    <div class="footer">
        <p>Copyright 2026 - My Website</p>
    </div>

</body>
</html>
