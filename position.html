
<!DOCTYPE html>
<html>
<head>
    <title>CSS Position Practice</title>

    <style>
        .card {
            position: relative;
            width: 300px;
            height: 180px;
            background-color: lightblue;
            border: 3px solid navy;
            margin: 50px;
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: red;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        My Card
        <span class="badge">NEW</span>
    </div>

</body>
</html>
